<!-- Basic slider -->
<div class="slider slider--value-40">
  <input
    class="slider__input"
    type="range"
    min="0"
    max="100"
    value="40"
    aria-label="Volume"
  />
</div>

<!-- Slider with a label and value -->
<div class="slider-field">
  <div class="slider-field__header">
    <span class="slider-field__label" id="slider-brightness-label">Brightness</span>
    <span class="slider-field__value">70%</span>
  </div>
  <div class="slider slider--value-70">
    <input
      class="slider__input"
      type="range"
      min="0"
      max="100"
      value="70"
      aria-labelledby="slider-brightness-label"
    />
  </div>
</div>

<!-- Range slider (two thumbs) -->
<div class="slider slider--range slider--range-25-75">
  <span class="slider__track" aria-hidden="true"></span>
  <span class="slider__fill" aria-hidden="true"></span>
  <input
    class="slider__input"
    type="range"
    min="0"
    max="100"
    value="25"
    aria-label="Minimum price"
  />
  <input
    class="slider__input"
    type="range"
    min="0"
    max="100"
    value="75"
    aria-label="Maximum price"
  />
</div>

<!-- Disabled -->
<div class="slider slider--value-40">
  <input
    class="slider__input"
    type="range"
    min="0"
    max="100"
    value="40"
    disabled
    aria-label="Volume"
  />
</div>
