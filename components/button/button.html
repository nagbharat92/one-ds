<div role="group" aria-label="Available actions">
  <button class="button" type="button">Primary</button>
  <button class="button button--secondary" type="button">Secondary</button>
  <button class="button button--outline" type="button">Outline</button>
  <button class="button button--quiet" type="button">Ghost</button>
  <button class="button button--danger" type="button">Destructive</button>
  <button class="button button--link" type="button">Link</button>
</div>

<button class="button" type="button">
  <svg class="fluent-icon" aria-hidden="true" viewBox="0 0 16 16"><use href="fluent-icons.svg#checkmark-16-regular"></use></svg><span class="text-trim">Save</span>
</button>

<button class="button button--outline button--icon" type="button" aria-label="Copy">
  <svg class="fluent-icon" aria-hidden="true" viewBox="0 0 16 16"><use href="fluent-icons.svg#copy-16-regular"></use></svg>
</button>

<button class="button button--pill" type="button">Rounded</button>

<button class="button" type="button" aria-busy="true" disabled>
  <span class="spinner" aria-hidden="true"></span><span class="text-trim">Saving</span>
</button>

<div class="button-group" role="group" aria-label="Text alignment">
  <button class="button button--outline" type="button">Left</button>
  <button class="button button--outline" type="button">Center</button>
  <button class="button button--outline" type="button">Right</button>
</div>

<div class="button-group" role="group" aria-label="Save">
  <button class="button" type="button">Save</button>
  <button class="button button--icon" type="button" aria-label="More save options">
    <svg class="fluent-icon" aria-hidden="true" viewBox="0 0 16 16"><use href="fluent-icons.svg#chevron-down-16-regular"></use></svg>
  </button>
</div>
